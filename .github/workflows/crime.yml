name: Mahayukti Crime — Long + Trailer Short (Tue/Sat)

on:
  schedule:
    - cron: '30 15 * * 2,6'   # 9:00 PM IST Tue/Sat — primary schedule
    - cron: '0 17 * * 2,6'    # 10:30 PM IST Tue/Sat — backup in case 9 PM stalls
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: crime-long
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  long:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          token: ${{ secrets.GH_TOKEN }}

      - name: Idempotency check
        id: guard
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT; exit 0
          fi
          TODAY_IST=$(TZ="Asia/Kolkata" date +%Y-%m-%d)
          STAMP="channels/counters/crime_long_stamp.txt"
          if [ -f "$STAMP" ]; then
            LAST=$(cat "$STAMP" | tr -d '[:space:]')
            if [ "$LAST" = "$TODAY_IST" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT; exit 0
            fi
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y --fix-missing ffmpeg fonts-open-sans fonts-noto-core
          pip install -r channels/requirements.txt

      - name: Generate long video + trailer short
        if: steps.guard.outputs.skip != 'true'
        working-directory: channels
        env:
          GROQ_API_KEY:               ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_CRIME_TOKEN_JSON:   ${{ secrets.YOUTUBE_CRIME_TOKEN_JSON }}
          GH_TOKEN:                   ${{ secrets.GH_TOKEN }}
          ELEVENLABS_API_KEY:         ${{ secrets.ELEVENLABS_API_KEY }}
          D_ID_API_KEY:               ${{ secrets.D_ID_API_KEY }}
          PEXELS_API_KEY:             ${{ secrets.PEXELS_API_KEY }}
          FB_PAGE_ACCESS_TOKEN:       ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID:                 ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID:                 ${{ secrets.IG_USER_ID }}
          MAKE_WEBHOOK_URL:           ${{ secrets.MAKE_WEBHOOK_URL }}
        run: python -u runner.py --channel crime --mode long


      - name: Persist counter and stamp
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TODAY_IST=$(TZ="Asia/Kolkata" date +%Y-%m-%d)
          echo "$TODAY_IST" > channels/counters/crime_long_stamp.txt
          git add channels/counters/
          git diff --staged --quiet || git commit -m "chore: crime long counter [skip ci]"
          git pull --rebase origin main && git push

      - name: Create GitHub issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          SEARCH="crime is failing"
          EXISTING=$(gh issue list --repo ${{ github.repository }} --state open \
            --search "in:title $SEARCH" --json number --jq length 2>/dev/null || echo "0")
          if [ "$EXISTING" -eq 0 ]; then
            gh issue create --repo ${{ github.repository }} \
              --title "crime is failing" \
              --body "Workflow **${{ github.workflow }}** failed. [View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
              || echo "Issue creation failed — check manually."
          else
            echo "Existing open failure issue found — skipping duplicate."
          fi
