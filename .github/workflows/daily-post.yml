name: MahaYukti Daily Marketing Automation

on:
  # Triggered exclusively by guardian.yml — no direct cron to stay under
  # GitHub's 20-slot-per-repo scheduler limit (guardian handles all timing)
  workflow_dispatch:
    inputs:
      post_type:
        description: 'Post type to run'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening
      only_platforms:
        description: 'Only post to these platforms (comma-separated: instagram, linkedin, facebook). Empty = all.'
        required: false
        default: ''
      force:
        description: 'Force run even if already posted today (bypass idempotency)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Prevent two morning (or two evening) runs from overlapping.
# If GitHub fires the delayed original cron after the guardian already triggered a run,
# the second run queues, sees the counter was updated today, and exits immediately.
concurrency:
  group: daily-post-${{ github.event.inputs.post_type || (contains(github.event.schedule, '0 3') && 'morning' || 'evening') }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  daily-post:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10   # enough to find recent counter commits
          token: ${{ secrets.GH_TOKEN }}

      # Resolve post type before the idempotency check so we know which counter to read
      - name: Determine post type
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            POST_TYPE="${{ github.event.inputs.post_type }}"
          elif echo "${{ github.event.schedule }}" | grep -q "0 3"; then
            POST_TYPE="morning"
          else
            POST_TYPE="evening"
          fi
          echo "POST_TYPE=$POST_TYPE" >> $GITHUB_ENV
          echo "post_type=$POST_TYPE" >> $GITHUB_OUTPUT

      # Skip all expensive work if today's post already happened.
      # Uses the git commit timestamp of the topic counter file (IST date comparison).
      - name: Idempotency check — skip if already posted today
        id: guard
        run: |
          FORCE="${{ github.event.inputs.force }}"
          if [ "$FORCE" = "true" ]; then
            echo "⚡ Force flag set — skipping idempotency check."
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          TODAY_IST=$(TZ="Asia/Kolkata" date +%Y-%m-%d)
          COUNTER_FILE="scripts/topic_counter_${POST_TYPE}.txt"

          LAST_TS=$(git log -1 --format="%ct" -- "$COUNTER_FILE" 2>/dev/null || echo "")
          if [ -n "$LAST_TS" ]; then
            LAST_IST=$(TZ="Asia/Kolkata" date -d "@$LAST_TS" +%Y-%m-%d)
            if [ "$LAST_IST" = "$TODAY_IST" ]; then
              echo "⏭️  $POST_TYPE post already completed today ($TODAY_IST). Skipping."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "▶️  Last $POST_TYPE post was $LAST_IST (not today $TODAY_IST). Proceeding."
          else
            echo "▶️  No prior $POST_TYPE post found. Proceeding."
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        if: steps.guard.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y --fix-missing ffmpeg

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          pip install \
            requests Pillow edge-tts "moviepy==1.0.3" numpy \
            google-auth google-auth-httplib2 google-auth-oauthlib \
            google-api-python-client anthropic

      - name: Refresh LinkedIn token (auto, if > 50 days old)
        if: steps.guard.outputs.skip != 'true'
        env:
          LINKEDIN_REFRESH_TOKEN:   ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_CLIENT_ID:       ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET:   ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_TOKEN_ISSUED_AT: ${{ secrets.LINKEDIN_TOKEN_ISSUED_AT }}
          GH_TOKEN:                 ${{ secrets.GH_TOKEN }}
        run: python scripts/refresh_linkedin_token.py

      - name: Run automation
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY:            ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN:                     ${{ secrets.GH_TOKEN }}
          POST_TYPE:                    ${{ env.POST_TYPE }}
          LINKEDIN_ACCESS_TOKEN:        ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN:          ${{ secrets.LINKEDIN_AUTHOR_URN }}
          MAKE_LINKEDIN_WEBHOOK_URL:    ${{ secrets.MAKE_WEBHOOK_URL }}
          IMGBB_API_KEY:                ${{ secrets.IMGBB_API_KEY }}
          FB_PAGE_ACCESS_TOKEN:         ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID:                   ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID:                   ${{ secrets.IG_USER_ID }}
          YOUTUBE_TOKEN_JSON:           ${{ secrets.YOUTUBE_MARKETING_TOKEN_JSON }}
          ONLY_PLATFORMS:               ${{ github.event.inputs.only_platforms }}
          ELEVENLABS_API_KEY:           ${{ secrets.ELEVENLABS_API_KEY }}
        run: python scripts/generate_and_post.py

      - name: Commit topic counter
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/topic_counter_morning.txt scripts/topic_counter_evening.txt
          git diff --staged --quiet || git commit -m "chore: update topic counter"
          git pull --rebase origin main
          git push

      - name: Done
        if: steps.guard.outputs.skip != 'true'
        run: echo "✅ ${{ env.POST_TYPE }} post complete — $(date)"
