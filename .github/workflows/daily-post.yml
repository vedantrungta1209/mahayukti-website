name: MahaYukti Daily Marketing Automation

on:
  schedule:
    - cron: '30 2 * * *'   # 8:00 AM IST (morning — clients)
    - cron: '30 12 * * *'  # 6:00 PM IST (evening — members)
  workflow_dispatch:
    inputs:
      post_type:
        description: 'Post type to run'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening

jobs:
  daily-post:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          pip install \
            requests Pillow edge-tts "moviepy==1.0.3" numpy \
            google-auth google-auth-httplib2 google-auth-oauthlib \
            google-api-python-client

      - name: Determine post type
        id: post_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "POST_TYPE=${{ github.event.inputs.post_type }}" >> $GITHUB_ENV
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "02" ]; then
              echo "POST_TYPE=morning" >> $GITHUB_ENV
            else
              echo "POST_TYPE=evening" >> $GITHUB_ENV
            fi
          fi

      - name: Refresh LinkedIn token (auto, if > 50 days old)
        env:
          LINKEDIN_REFRESH_TOKEN:   ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_CLIENT_ID:       ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET:   ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_TOKEN_ISSUED_AT: ${{ secrets.LINKEDIN_TOKEN_ISSUED_AT }}
          GH_TOKEN:                 ${{ secrets.GH_TOKEN }}
        run: python scripts/refresh_linkedin_token.py

      - name: Run automation
        env:
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN:               ${{ secrets.GH_TOKEN }}
          POST_TYPE:              ${{ env.POST_TYPE }}
          LINKEDIN_ACCESS_TOKEN:  ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN:    ${{ secrets.LINKEDIN_AUTHOR_URN }}
          FB_PAGE_ACCESS_TOKEN:   ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID:             ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID:             ${{ secrets.IG_USER_ID }}
          YOUTUBE_TOKEN_JSON:     ${{ secrets.YOUTUBE_MARKETING_TOKEN_JSON }}
        run: python scripts/generate_and_post.py

      - name: Commit topic counter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/topic_counter_morning.txt scripts/topic_counter_evening.txt
          git diff --staged --quiet || git commit -m "chore: update topic counter"
          git pull --rebase origin main
          git push

      - name: Done
        run: echo "✅ ${{ env.POST_TYPE }} post complete — $(date)"
