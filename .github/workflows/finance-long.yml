name: Mahayukti Finance — Long-form (Mon/Wed/Fri)

on:
  schedule:
    - cron: '30 3 * * 1,3,5'   # 03:30 UTC = 09:00 IST Mon/Wed/Fri
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: finance-long
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  trigger-kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
          token: ${{ secrets.GH_TOKEN }}

      - name: Idempotency check
        id: guard
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT; exit 0
          fi
          COUNT=$(git log --since="$(date -u +%Y-%m-%dT00:00:00Z)" \
            --format="%s" -- channels/counters/finance_long.txt \
            | grep -c "counter" || echo 0)
          [ "$COUNT" -ge 1 ] && echo "skip=true" >> $GITHUB_OUTPUT \
                             || echo "skip=false" >> $GITHUB_OUTPUT

      - name: Set up Python + Kaggle CLI
        if: steps.guard.outputs.skip != 'true'
        run: pip install kaggle

      - name: Inject secrets into kernel
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_FINANCE_TOKEN_JSON: ${{ secrets.YOUTUBE_FINANCE_TOKEN_JSON }}
          GH_TOKEN_VAL: ${{ secrets.GH_TOKEN }}
        run: |
          python3 -c "
          import os, json
          with open('kaggle/finance-long/secrets.json', 'w') as f:
              json.dump({
                  'ANTHROPIC_API_KEY': os.environ['ANTHROPIC_API_KEY'],
                  'YOUTUBE_FINANCE_TOKEN_JSON': os.environ['YOUTUBE_FINANCE_TOKEN_JSON'],
                  'GH_TOKEN': os.environ['GH_TOKEN_VAL'],
              }, f)
          "

      - name: Push kernel + retry on P100
        if: steps.guard.outputs.skip != 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          KERNEL="mahayukticoncierge/mahayukti-finance-long-form"
          for attempt in 1 2 3; do
            echo "── Attempt $attempt ──"
            kaggle kernels push -p kaggle/finance-long/
            echo "Polling $KERNEL…"
            for i in $(seq 1 200); do
              STATUS=$(kaggle kernels status "$KERNEL" 2>&1 | grep -oE 'running|complete|error|cancelAcknowledged' | head -1)
              echo "  [$i] status: $STATUS"
              if [ "$STATUS" = "complete" ]; then
                echo "✅ Kaggle run complete"
                exit 0
              fi
              if [ "$STATUS" = "error" ] || [ "$STATUS" = "cancelAcknowledged" ]; then
                LOGS=$(kaggle kernels output "$KERNEL" -p /tmp/kfl-out/ 2>/dev/null && cat /tmp/kfl-out/*.log 2>/dev/null | grep -o 'Incompatible GPU[^.]*' | head -1)
                if echo "$LOGS" | grep -q "Incompatible GPU"; then
                  echo "⚠️  Got P100, retrying for T4…"
                  break
                fi
                echo "❌ Kaggle run failed"
                exit 1
              fi
              sleep 30
            done
          done
          echo "❌ All attempts exhausted"
          exit 1
