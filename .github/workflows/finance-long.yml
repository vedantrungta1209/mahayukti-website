name: Mahayukti Finance — Long-form (Mon/Wed/Fri)

on:
  schedule:
    - cron: '30 3 * * 1,3,5'   # 03:30 UTC = 09:00 IST Mon/Wed/Fri
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: finance-long
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  trigger-kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
          token: ${{ secrets.GH_TOKEN }}

      - name: Idempotency check
        id: guard
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT; exit 0
          fi
          COUNT=$(git log --since="$(date -u +%Y-%m-%dT00:00:00Z)" \
            --format="%s" -- channels/counters/finance_long.txt \
            | grep -c "counter" || echo 0)
          [ "$COUNT" -ge 1 ] && echo "skip=true" >> $GITHUB_OUTPUT \
                             || echo "skip=false" >> $GITHUB_OUTPUT

      - name: Set up Python + Kaggle CLI
        if: steps.guard.outputs.skip != 'true'
        run: pip install kaggle

      - name: Patch kernel-metadata with Kaggle username
        if: steps.guard.outputs.skip != 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          sed -i "s/KAGGLE_USERNAME/$KAGGLE_USERNAME/g" \
            kaggle/finance-long/kernel-metadata.json

      - name: Push kernel to Kaggle (triggers run)
        if: steps.guard.outputs.skip != 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY:      ${{ secrets.KAGGLE_KEY }}
        run: kaggle kernels push -p kaggle/finance-long/

      - name: Wait for Kaggle run to complete
        if: steps.guard.outputs.skip != 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY:      ${{ secrets.KAGGLE_KEY }}
        run: |
          KERNEL="$KAGGLE_USERNAME/mahayukti-finance-long"
          echo "Polling $KERNEL…"
          for i in $(seq 1 200); do
            STATUS=$(kaggle kernels status "$KERNEL" 2>&1 | grep -oE 'running|complete|error|cancelAcknowledged' | head -1)
            echo "  [$i] status: $STATUS"
            if [ "$STATUS" = "complete" ]; then
              echo "✅ Kaggle run complete"
              exit 0
            fi
            if [ "$STATUS" = "error" ] || [ "$STATUS" = "cancelAcknowledged" ]; then
              echo "❌ Kaggle run failed"
              exit 1
            fi
            sleep 30
          done
          echo "⏱️ Timeout"
          exit 1
