name: Mahayukti Finance — Long-form (Mon/Wed/Fri)

on:
  schedule:
    - cron: '30 3 * * 1,3,5'   # 03:30 UTC = 09:00 IST Mon/Wed/Fri
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: finance-long
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
          token: ${{ secrets.GH_TOKEN }}

      - name: Idempotency check
        id: guard
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT; exit 0
          fi
          TODAY_IST=$(TZ="Asia/Kolkata" date +%Y-%m-%d)
          STAMP="channels/counters/finance_long_stamp.txt"
          if [ -f "$STAMP" ]; then
            LAST=$(cat "$STAMP" | tr -d '[:space:]')
            if [ "$LAST" = "$TODAY_IST" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT; exit 0
            fi
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing ffmpeg fonts-liberation
          pip install anthropic edge-tts requests pillow \
            google-api-python-client google-auth \
            google-auth-oauthlib google-auth-httplib2


      - name: Run pipeline
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_FINANCE_TOKEN_JSON: ${{ secrets.YOUTUBE_FINANCE_TOKEN_JSON }}
          GH_TOKEN:                   ${{ secrets.GH_TOKEN }}
          PEXELS_API_KEY:             ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY:         ${{ secrets.ELEVENLABS_API_KEY }}
          MAKE_WEBHOOK_URL:           ${{ secrets.MAKE_WEBHOOK_URL }}
        run: python pipelines/finance-long.py

      - name: Write date stamp
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TODAY_IST=$(TZ="Asia/Kolkata" date +%Y-%m-%d)
          echo "$TODAY_IST" > channels/counters/finance_long_stamp.txt
          git add channels/counters/
          git diff --staged --quiet || git commit -m "chore: finance long counter [skip ci]"
          git pull --rebase origin main && git push

      - name: Notify Jarvis on failure
        if: failure()
        run: |
          curl -s -X POST https://admin.rajaansh.com/jarvis/api/gh-notify \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"ghnotify-2026\",\"workflow\":\"${{ github.workflow }}\",\"error\":\"finance-long failed\",\"run_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true
