name: Mahayukti Finance — Long-form (Mon/Wed/Fri)

on:
  schedule:
    - cron: '30 3 * * 1,3,5'   # 03:30 UTC = 09:00 IST Mon/Wed/Fri
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: finance-long
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
          token: ${{ secrets.GH_TOKEN }}

      - name: Idempotency check
        id: guard
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT; exit 0
          fi
          COUNT=$(git log --since="$(date -u +%Y-%m-%dT00:00:00Z)" \
            --format="%s" -- channels/counters/finance_long.txt \
            | grep -c "counter" || echo 0)
          [ "$COUNT" -ge 1 ] && echo "skip=true" >> $GITHUB_OUTPUT \
                             || echo "skip=false" >> $GITHUB_OUTPUT

      - name: Set up Python + Modal
        if: steps.guard.outputs.skip != 'true'
        run: pip install modal

      - name: Run pipeline on Modal T4
        if: steps.guard.outputs.skip != 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run modal/finance-long/run.py
