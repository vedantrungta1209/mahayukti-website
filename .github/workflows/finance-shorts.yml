name: Mahayukti Finance — Shorts (2× daily)

on:
  schedule:
    - cron: '0 4 * * *'    # 04:00 UTC = 09:30 IST
    - cron: '0 10 * * *'   # 10:00 UTC = 15:30 IST
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: finance-short-${{ github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
          token: ${{ secrets.GH_TOKEN }}

      - name: Idempotency check
        id: guard
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT; exit 0
          fi
          TODAY_IST=$(TZ="Asia/Kolkata" date +%Y-%m-%d)
          HOUR_IST=$(TZ="Asia/Kolkata" date +%H)
          SLOT=$( [ "$HOUR_IST" -lt 14 ] && echo "morning" || echo "evening" )
          STAMP="channels/counters/finance_short_${SLOT}_stamp.txt"
          if [ -f "$STAMP" ]; then
            LAST=$(cat "$STAMP" | tr -d '[:space:]')
            if [ "$LAST" = "$TODAY_IST" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT; exit 0
            fi
          fi
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "SLOT=$SLOT" >> $GITHUB_ENV

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y --fix-missing ffmpeg fonts-liberation
          pip install anthropic edge-tts requests pillow \
            google-api-python-client google-auth \
            google-auth-oauthlib google-auth-httplib2

      - name: Run pipeline
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_FINANCE_TOKEN_JSON: ${{ secrets.YOUTUBE_FINANCE_TOKEN_JSON }}
          GH_TOKEN:                  ${{ secrets.GH_TOKEN }}
          PEXELS_API_KEY:            ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY:        ${{ secrets.ELEVENLABS_API_KEY }}
          FB_PAGE_ACCESS_TOKEN:      ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID:                ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID:                ${{ secrets.IG_USER_ID }}
          MAKE_WEBHOOK_URL:          ${{ secrets.MAKE_WEBHOOK_URL }}
        run: python pipelines/finance-short.py

      - name: Write slot stamp
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TODAY_IST=$(TZ="Asia/Kolkata" date +%Y-%m-%d)
          echo "$TODAY_IST" > "channels/counters/finance_short_${SLOT}_stamp.txt"
          git add channels/counters/
          git diff --staged --quiet || git commit -m "chore: finance short counter [skip ci]"
          git pull --rebase origin main && git push

      - name: Create GitHub issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          SEARCH="finance-shorts is failing"
          EXISTING=$(gh issue list --repo ${{ github.repository }} --state open \
            --search "in:title $SEARCH" --json number --jq length 2>/dev/null || echo "0")
          if [ "$EXISTING" -eq 0 ]; then
            gh issue create --repo ${{ github.repository }} \
              --title "finance-shorts is failing" \
              --body "Workflow **${{ github.workflow }}** failed. [View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
              || echo "Issue creation failed — check manually."
          else
            echo "Existing open failure issue found — skipping duplicate."
          fi
