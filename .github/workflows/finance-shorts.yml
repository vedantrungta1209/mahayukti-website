name: Mahayukti Finance — Shorts (2× daily)

on:
  schedule:
    - cron: '0 4 * * *'    # 04:00 UTC = 09:30 IST
    - cron: '0 10 * * *'   # 10:00 UTC = 15:30 IST
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: finance-short-${{ github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
          token: ${{ secrets.GH_TOKEN }}

      - name: Idempotency check
        id: guard
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT; exit 0
          fi
          COUNT=$(git log --since="$(date -u +%Y-%m-%dT%H:00:00Z)" \
            --format="%s" -- channels/counters/finance_short.txt \
            | grep -c "counter" || echo 0)
          [ "$COUNT" -ge 1 ] && echo "skip=true" >> $GITHUB_OUTPUT \
                             || echo "skip=false" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.11'

      - name: Install system dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg \
            fonts-liberation fonts-dejavu-core

      - name: Install Python dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r channels/requirements_v2.txt

      - name: Generate and upload
        if: steps.guard.outputs.skip != 'true'
        working-directory: channels
        env:
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_KEY:                    ${{ secrets.FAL_KEY }}
          YOUTUBE_FINANCE_TOKEN_JSON: ${{ secrets.YOUTUBE_FINANCE_TOKEN_JSON }}
          GH_TOKEN:                   ${{ secrets.GH_TOKEN }}
        run: python core/runner.py --channel finance --mode short

      - name: Persist counter
        if: steps.guard.outputs.skip != 'true' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channels/counters/
          git diff --staged --quiet || \
            git commit -m "chore: finance short counter [skip ci]"
          git pull --rebase origin main && git push
