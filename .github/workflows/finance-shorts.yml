name: Mahayukti Finance — Shorts (2× daily)

on:
  schedule:
    - cron: '0 4 * * *'    # 04:00 UTC = 09:30 IST
    - cron: '0 10 * * *'   # 10:00 UTC = 15:30 IST
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: finance-short-${{ github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
          token: ${{ secrets.GH_TOKEN }}

      - name: Idempotency check
        id: guard
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT; exit 0
          fi
          COUNT=$(git log --since="$(date -u +%Y-%m-%dT%H:00:00Z)" \
            --format="%s" -- channels/counters/finance_short.txt \
            | grep -c "counter" || echo 0)
          [ "$COUNT" -ge 1 ] && echo "skip=true" >> $GITHUB_OUTPUT \
                             || echo "skip=false" >> $GITHUB_OUTPUT

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y --fix-missing ffmpeg fonts-liberation
          pip install anthropic edge-tts requests pillow \
            google-api-python-client google-auth \
            google-auth-oauthlib google-auth-httplib2

      - name: Run pipeline
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_FINANCE_TOKEN_JSON: ${{ secrets.YOUTUBE_FINANCE_TOKEN_JSON }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python pipelines/finance-short.py
