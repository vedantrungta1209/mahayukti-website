name: Mahayukti Finance — Shorts (2× daily)

on:
  schedule:
    - cron: '0 4 * * *'    # 04:00 UTC = 09:30 IST
    - cron: '0 10 * * *'   # 10:00 UTC = 15:30 IST
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: finance-short-${{ github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  trigger-kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
          token: ${{ secrets.GH_TOKEN }}

      - name: Idempotency check
        id: guard
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT; exit 0
          fi
          COUNT=$(git log --since="$(date -u +%Y-%m-%dT%H:00:00Z)" \
            --format="%s" -- channels/counters/finance_short.txt \
            | grep -c "counter" || echo 0)
          [ "$COUNT" -ge 1 ] && echo "skip=true" >> $GITHUB_OUTPUT \
                             || echo "skip=false" >> $GITHUB_OUTPUT

      - name: Set up Python + Kaggle CLI
        if: steps.guard.outputs.skip != 'true'
        run: pip install kaggle

      - name: Patch kernel-metadata with Kaggle username
        if: steps.guard.outputs.skip != 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          sed -i "s/KAGGLE_USERNAME/$KAGGLE_USERNAME/g" \
            kaggle/finance-short/kernel-metadata.json

      - name: Push kernel to Kaggle (triggers run)
        if: steps.guard.outputs.skip != 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY:      ${{ secrets.KAGGLE_KEY }}
        run: kaggle kernels push -p kaggle/finance-short/

      - name: Wait for Kaggle run to complete
        if: steps.guard.outputs.skip != 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY:      ${{ secrets.KAGGLE_KEY }}
        run: |
          KERNEL="$KAGGLE_USERNAME/mahayukti-finance-short"
          echo "Polling $KERNEL…"
          for i in $(seq 1 120); do
            STATUS=$(kaggle kernels status "$KERNEL" 2>&1 | grep -oE 'running|complete|error|cancelAcknowledged' | head -1)
            echo "  [$i] status: $STATUS"
            if [ "$STATUS" = "complete" ]; then
              echo "✅ Kaggle run complete"
              exit 0
            fi
            if [ "$STATUS" = "error" ] || [ "$STATUS" = "cancelAcknowledged" ]; then
              echo "❌ Kaggle run failed"
              kaggle kernels output "$KERNEL" -p /tmp/kaggle-output/ || true
              exit 1
            fi
            sleep 30
          done
          echo "⏱️ Timeout waiting for Kaggle run"
          exit 1
