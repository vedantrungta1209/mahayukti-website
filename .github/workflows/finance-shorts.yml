name: Mahayukti Finance — Shorts (2× daily)

on:
  schedule:
    - cron: '0 4 * * *'    # 04:00 UTC = 09:30 IST
    - cron: '0 10 * * *'   # 10:00 UTC = 15:30 IST
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: finance-short-${{ github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  trigger-kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
          token: ${{ secrets.GH_TOKEN }}

      - name: Idempotency check
        id: guard
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT; exit 0
          fi
          COUNT=$(git log --since="$(date -u +%Y-%m-%dT%H:00:00Z)" \
            --format="%s" -- channels/counters/finance_short.txt \
            | grep -c "counter" || echo 0)
          [ "$COUNT" -ge 1 ] && echo "skip=true" >> $GITHUB_OUTPUT \
                             || echo "skip=false" >> $GITHUB_OUTPUT

      - name: Set up Python + Kaggle CLI
        if: steps.guard.outputs.skip != 'true'
        run: pip install kaggle

      - name: Inject secrets into kernel
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_FINANCE_TOKEN_JSON: ${{ secrets.YOUTUBE_FINANCE_TOKEN_JSON }}
          GH_TOKEN_VAL: ${{ secrets.GH_TOKEN }}
        run: |
          python3 -c "
          import os, json
          with open('kaggle/finance-short/secrets.json', 'w') as f:
              json.dump({
                  'ANTHROPIC_API_KEY': os.environ['ANTHROPIC_API_KEY'],
                  'YOUTUBE_FINANCE_TOKEN_JSON': os.environ['YOUTUBE_FINANCE_TOKEN_JSON'],
                  'GH_TOKEN': os.environ['GH_TOKEN_VAL'],
              }, f)
          "

      - name: Push kernel to Kaggle
        if: steps.guard.outputs.skip != 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: kaggle kernels push -p kaggle/finance-short/

      - name: Wait for Kaggle run to complete
        if: steps.guard.outputs.skip != 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          KERNEL="mahayukticoncierge/mahayukti-finance-short"
          echo "Polling $KERNEL…"
          for i in $(seq 1 120); do
            STATUS=$(kaggle kernels status "$KERNEL" 2>&1 | grep -ioE 'running|complete|error|cancelAcknowledged' | head -1 | tr '[:upper:]' '[:lower:]')
            echo "  [$i] status: $STATUS"
            if [ "$STATUS" = "complete" ]; then
              echo "✅ Kaggle run complete"
              exit 0
            fi
            if [ "$STATUS" = "error" ] || [ "$STATUS" = "cancelAcknowledged" ]; then
              echo "❌ Kaggle run failed"
              kaggle kernels output "$KERNEL" -p /tmp/kfs-out/ || true
              exit 1
            fi
            sleep 30
          done
          echo "⏱️ Timeout waiting for Kaggle run"
          exit 1
