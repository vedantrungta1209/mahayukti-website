name: Post Guardian

# GitHub's cron scheduler can delay runs by up to 12+ hours during high-load periods.
# This guardian runs every ~90 min and also accepts external pings via workflow_dispatch.
#
# PERMANENT FIX FOR SCHEDULER STALLS — set up an external cron (free):
#   Service : https://cron-job.org  (free, no credit card)
#   Schedule: every 60 minutes
#   Method  : POST
#   URL     : https://api.github.com/repos/vedantrungta1209/mahayukti-website/actions/workflows/guardian.yml/dispatches
#   Headers : Authorization: Bearer <GH_TOKEN>   (GitHub PAT with repo scope)
#             Content-Type: application/json
#   Body    : {"ref":"main"}
#
# The guardian checks git counter files and only triggers a workflow when a post is
# actually missing — so pinging every hour is safe and will never double-post.

on:
  schedule:
    # ── Runs every ~90 min so even a 12-hour GitHub scheduler stall is caught ──
    - cron: '30 3 * * *'   # 9:00 AM IST
    - cron: '0 5 * * *'    # 10:30 AM IST
    - cron: '30 6 * * *'   # 12:00 PM IST
    - cron: '0 8 * * *'    # 1:30 PM IST
    - cron: '30 9 * * *'   # 3:00 PM IST
    - cron: '0 11 * * *'   # 4:30 PM IST
    - cron: '30 12 * * *'  # 6:00 PM IST
    - cron: '0 13 * * *'   # 6:30 PM IST
    - cron: '30 14 * * *'  # 8:00 PM IST
    - cron: '0 16 * * *'   # 9:30 PM IST
    - cron: '30 17 * * *'  # 11:00 PM IST
    - cron: '0 19 * * *'   # 12:30 AM IST
    - cron: '0 21 * * *'   # 2:30 AM IST
    - cron: '0 1 * * *'    # 6:30 AM IST
    - cron: '0 2 * * *'    # 7:30 AM IST
    - cron: '0 14 * * 2,6' # 7:30 PM IST Tue/Sat  (early crime window)
    - cron: '0 15 * * 2,6' # 8:30 PM IST Tue/Sat  (pre-crime slot)
    - cron: '0 17 * * 2,6' # 10:30 PM IST Tue/Sat (late crime backup)

  # Triggered by external cron (cron-job.org) or manually
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  guard:
    name: Check and recover missed posts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (with recent history for counter timestamps)
        uses: actions/checkout@v4
        with:
          fetch-depth: 15
          token: ${{ secrets.GH_TOKEN }}

      - name: Detect and trigger any overdue posts
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          # ── Helpers ──────────────────────────────────────────────────────────

          # Returns "true" if the given counter file was last committed today (IST)
          was_posted_today() {
            local COUNTER_FILE="$1"
            local TODAY_IST
            TODAY_IST=$(TZ="Asia/Kolkata" date +%Y-%m-%d)
            local LAST_TS
            LAST_TS=$(git log -1 --format="%ct" -- "$COUNTER_FILE" 2>/dev/null || echo "")
            if [ -z "$LAST_TS" ]; then
              echo "false"
              return
            fi
            local LAST_IST
            LAST_IST=$(TZ="Asia/Kolkata" date -d "@$LAST_TS" +%Y-%m-%d)
            [ "$LAST_IST" = "$TODAY_IST" ] && echo "true" || echo "false"
          }

          # Returns number of times a counter file was committed today (IST)
          posts_today_count() {
            local COUNTER_FILE="$1"
            local MIDNIGHT_IST
            MIDNIGHT_IST=$(TZ="Asia/Kolkata" date -d "today 00:00" -u +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
              || TZ="Asia/Kolkata" date -v0H -v0M -v0S -u +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
              || date -u +%Y-%m-%dT00:00:00Z)
            git log --since="$MIDNIGHT_IST" --format="%H" -- "$COUNTER_FILE" 2>/dev/null | wc -l | tr -d ' '
          }

          # Returns whole number of days since the counter file was last committed (0 = today)
          days_since_last_post() {
            local COUNTER_FILE="$1"
            local LAST_TS
            LAST_TS=$(git log -1 --format="%ct" -- "$COUNTER_FILE" 2>/dev/null || echo "")
            if [ -z "$LAST_TS" ]; then
              echo "999"
              return
            fi
            local NOW_TS
            NOW_TS=$(date +%s)
            echo $(( (NOW_TS - LAST_TS) / 86400 ))
          }

          # Trigger a workflow; logs an error if the gh command fails so failures are visible
          trigger_workflow() {
            local WORKFLOW="$1"
            local EXTRA_ARGS="$2"
            echo "  → Triggering $WORKFLOW $EXTRA_ARGS"
            local OUT
            OUT=$(eval "gh workflow run $WORKFLOW --repo $REPO --ref main $EXTRA_ARGS" 2>&1)
            local RC=$?
            if [ $RC -ne 0 ]; then
              echo "  ❌ trigger_workflow FAILED (rc=$RC): $OUT"
            else
              echo "  ✅ trigger sent"
            fi
            return $RC
          }

          # ── Context ──────────────────────────────────────────────────────────
          IST_HOUR=$(TZ="Asia/Kolkata" date +%-H)
          IST_DOW=$(TZ="Asia/Kolkata" date +%u)   # 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri 6=Sat 7=Sun
          IST_TIME=$(TZ="Asia/Kolkata" date '+%Y-%m-%d %H:%M %Z')
          echo "Guardian running at: $IST_TIME (IST hour: $IST_HOUR, DOW: $IST_DOW)"

          # ── Morning social post (9 AM IST target, every day) ────────────────
          # No upper bound: if it's past 9 AM and still unposted, trigger now.
          # Idempotency check inside daily-post.yml prevents any double-posting.
          if [ "$IST_HOUR" -ge 9 ]; then
            if [ "$(was_posted_today scripts/topic_counter_morning.txt)" = "false" ]; then
              echo "⚠️  Morning post MISSING — triggering now"
              trigger_workflow "daily-post.yml" "-f post_type=morning"
            else
              echo "✅ Morning post already done today"
            fi
          fi

          # ── AI Shorts — 2× daily (10 AM + 6:30 PM IST targets) ─────────────────
          SHORT_COUNT=$(posts_today_count MahayuktiAI/tool_counter_short.txt)
          echo "AI Shorts today: $SHORT_COUNT/2"
          # After 10 AM: need at least 1
          if [ "$IST_HOUR" -ge 10 ] && [ "$SHORT_COUNT" -lt 1 ]; then
            echo "⚠️  Morning AI Short MISSING — triggering now"
            trigger_workflow "mahayukti-ai-shorts.yml" ""
          # After 6:30 PM: need 2
          elif [ "$IST_HOUR" -ge 18 ] && [ "$SHORT_COUNT" -lt 2 ]; then
            echo "⚠️  Evening AI Short MISSING — triggering now"
            trigger_workflow "mahayukti-ai-shorts.yml" ""
          else
            echo "✅ AI Shorts on track ($SHORT_COUNT done)"
          fi

          # ── X News Pulse (every ~2 hours — fires if no pulse in last 2 hrs) ───
          # Uses the log file commit timestamp as the last-posted signal.
          PULSE_LAST_TS=$(git log -1 --format="%ct" -- "scripts/x_news_pulse_log.json" 2>/dev/null || echo "")
          NOW_TS=$(date +%s)
          if [ -z "$PULSE_LAST_TS" ]; then
            PULSE_AGE=9999
          else
            PULSE_AGE=$(( (NOW_TS - PULSE_LAST_TS) / 3600 ))
          fi
          echo "News Pulse: last posted ${PULSE_AGE}h ago"
          if [ "$PULSE_AGE" -ge 2 ]; then
            echo "⚠️  News Pulse overdue — triggering now"
            trigger_workflow "x-news-pulse.yml" ""
          else
            echo "✅ News Pulse posted within last 2 hours"
          fi

          # ── Geo/Strategic awareness post (2 PM IST target, every day) ────────
          if [ "$IST_HOUR" -ge 14 ]; then
            if [ "$(was_posted_today scripts/topic_counter_geo.txt)" = "false" ]; then
              echo "⚠️  Geo post MISSING — triggering now"
              trigger_workflow "geo-post.yml" ""
            else
              echo "✅ Geo post already done today"
            fi
          fi

          # ── Evening social post (6:30 PM IST target, every day) ─────────────
          if [ "$IST_HOUR" -ge 18 ]; then
            if [ "$(was_posted_today scripts/topic_counter_evening.txt)" = "false" ]; then
              echo "⚠️  Evening post MISSING — triggering now"
              trigger_workflow "daily-post.yml" "-f post_type=evening"
            else
              echo "✅ Evening post already done today"
            fi
          fi

          # ── YouTube upload (7 PM IST target) ─────────────────────────────────
          if [ "$IST_HOUR" -ge 19 ]; then
            if [ "$(was_posted_today content-automation/topic_counter.txt)" = "false" ]; then
              echo "⚠️  YouTube upload MISSING — triggering now"
              trigger_workflow "youtube-upload.yml" ""
            else
              echo "✅ YouTube upload already done today"
            fi
          fi

          # ── AI Long-form (Mon/Wed/Fri after 8:30 PM IST) ─────────────────────
          if { [ "$IST_DOW" -eq 1 ] || [ "$IST_DOW" -eq 3 ] || [ "$IST_DOW" -eq 5 ]; } && [ "$IST_HOUR" -ge 21 ]; then
            if [ "$(was_posted_today MahayuktiAI/tool_counter_long.txt)" = "false" ]; then
              echo "⚠️  AI Long-form MISSING — triggering now"
              trigger_workflow "mahayukti-ai-long.yml" ""
            else
              echo "✅ AI Long-form posted today"
            fi
          fi

          # ── Crime episode (Tue/Sat after 9 PM IST, or overdue catch-up) ────────
          CRIME_DAYS=$(days_since_last_post channels/counters/crime_long.txt)
          echo "Crime: last posted ${CRIME_DAYS}d ago"
          # Primary window: Tue/Sat after 9 PM IST
          CRIME_TRIGGERED=false
          if { [ "$IST_DOW" -eq 2 ] || [ "$IST_DOW" -eq 6 ]; } && [ "$IST_HOUR" -ge 21 ]; then
            if [ "$(was_posted_today channels/counters/crime_long.txt)" = "false" ]; then
              echo "⚠️  Crime episode MISSING (scheduled day) — triggering now"
              trigger_workflow "crime.yml" "" && CRIME_TRIGGERED=true
            else
              echo "✅ Crime episode posted today"
            fi
          fi
          # Catch-up: if not triggered above AND overdue by 3+ days AND it's after 8 PM IST, trigger regardless of day
          if [ "$CRIME_TRIGGERED" = "false" ] && [ "$CRIME_DAYS" -ge 3 ] && [ "$IST_HOUR" -ge 20 ]; then
            if [ "$(was_posted_today channels/counters/crime_long.txt)" = "false" ]; then
              echo "⚠️  Crime overdue by ${CRIME_DAYS}d — catch-up trigger"
              trigger_workflow "crime.yml" ""
            fi
          fi

          # ── Finance Shorts — 2× daily (9:30 AM + 3:30 PM IST targets) ────────
          FIN_SHORT_COUNT=$(posts_today_count channels/counters/finance_short.txt)
          echo "Finance Shorts today: $FIN_SHORT_COUNT/2"
          if [ "$IST_HOUR" -ge 10 ] && [ "$FIN_SHORT_COUNT" -lt 1 ]; then
            echo "⚠️  Morning Finance Short MISSING — triggering now"
            trigger_workflow "finance-shorts.yml" ""
          elif [ "$IST_HOUR" -ge 16 ] && [ "$FIN_SHORT_COUNT" -lt 2 ]; then
            echo "⚠️  Afternoon Finance Short MISSING — triggering now"
            trigger_workflow "finance-shorts.yml" ""
          else
            echo "✅ Finance Shorts on track ($FIN_SHORT_COUNT done)"
          fi

          # ── Finance Long-form (Mon/Wed/Fri after 10:30 AM IST, or overdue catch-up) ──
          FIN_LONG_DAYS=$(days_since_last_post channels/counters/finance_long.txt)
          echo "Finance Long-form: last posted ${FIN_LONG_DAYS}d ago"
          FIN_LONG_TRIGGERED=false
          if { [ "$IST_DOW" -eq 1 ] || [ "$IST_DOW" -eq 3 ] || [ "$IST_DOW" -eq 5 ]; } && [ "$IST_HOUR" -ge 11 ]; then
            if [ "$(was_posted_today channels/counters/finance_long.txt)" = "false" ]; then
              echo "⚠️  Finance Long-form MISSING (scheduled day) — triggering now"
              trigger_workflow "finance-long.yml" "" && FIN_LONG_TRIGGERED=true
            else
              echo "✅ Finance Long-form posted today"
            fi
          fi
          # Catch-up: if overdue by 2+ days AND after 9 AM IST on any day, trigger
          if [ "$FIN_LONG_TRIGGERED" = "false" ] && [ "$FIN_LONG_DAYS" -ge 2 ] && [ "$IST_HOUR" -ge 9 ]; then
            if [ "$(was_posted_today channels/counters/finance_long.txt)" = "false" ]; then
              echo "⚠️  Finance Long-form overdue by ${FIN_LONG_DAYS}d — catch-up trigger"
              trigger_workflow "finance-long.yml" ""
            fi
          fi

          # ── FB token expiry check (once daily at 9 AM IST) ───────────────────
          # Creates a GitHub issue when fewer than 14 days remain.
          # Token expires every ~60 days — needs manual refresh via Graph API Explorer.
          if [ "$IST_HOUR" -eq 9 ] && [ -n "$FB_PAGE_ACCESS_TOKEN" ]; then
            echo "Checking FB_PAGE_ACCESS_TOKEN expiry..."
            EXPIRES_AT=$(curl -s \
              "https://graph.facebook.com/debug_token?input_token=${FB_PAGE_ACCESS_TOKEN}&access_token=${FB_PAGE_ACCESS_TOKEN}" \
              | python3 -c "import json,sys; d=json.load(sys.stdin).get('data',{}); print(d.get('expires_at',0))" 2>/dev/null || echo "0")

            if [ "$EXPIRES_AT" -gt 0 ]; then
              DAYS_LEFT=$(python3 -c "import time; print(int(($EXPIRES_AT - time.time()) / 86400))" 2>/dev/null || echo "99")
              echo "  FB token expires in $DAYS_LEFT days"
              if [ "$DAYS_LEFT" -lt 14 ]; then
                echo "⚠️  Token expiring soon — checking for existing issue..."
                EXISTING=$(gh issue list --repo "$REPO" --state open \
                  --search "FB_PAGE_ACCESS_TOKEN expires" --json number --jq length 2>/dev/null || echo "0")
                if [ "$EXISTING" -eq 0 ]; then
                  printf '%s\n' \
                    "## Action Required" \
                    "The \`FB_PAGE_ACCESS_TOKEN\` secret expires in **${DAYS_LEFT} days**." \
                    "" \
                    "When it expires, **Instagram and Facebook stop posting** (both use this token)." \
                    "" \
                    "## How to refresh" \
                    "1. Go to [Graph API Explorer](https://developers.facebook.com/tools/explorer/)" \
                    "2. Select the **Mahayukti Automation** app" \
                    "3. Generate a new User Token with \`pages_manage_posts\`, \`instagram_basic\`, \`instagram_content_publish\` scopes" \
                    "4. Exchange for a long-lived token via: \`GET /oauth/access_token?grant_type=fb_exchange_token\`" \
                    "5. Get the Page Access Token via: \`GET /me/accounts\`" \
                    "6. Update the \`FB_PAGE_ACCESS_TOKEN\` secret in GitHub repo settings" \
                    "" \
                    "Close this issue once the secret is updated." \
                    > /tmp/fb_expiry_body.md
                  gh issue create \
                    --repo "$REPO" \
                    --title "FB_PAGE_ACCESS_TOKEN expires in ${DAYS_LEFT} days — refresh needed" \
                    --body-file /tmp/fb_expiry_body.md 2>/dev/null \
                  && echo "  GitHub issue created." \
                  || echo "  Issue creation failed — check manually."
                else
                  echo "  Issue already open — skipping duplicate."
                fi
              fi
            else
              echo "  Could not read token expiry (API error or non-expiring token)"
            fi
          fi

          echo ""
          echo "Guardian check complete."
