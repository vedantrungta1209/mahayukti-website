name: Mahayukti Hustle — Long-form (Mon/Thu)

on:
  schedule:
    - cron: '30 13 * * 1'  # Monday    7:00 PM IST
    - cron: '30 13 * * 4'  # Thursday  7:00 PM IST
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: hustle-long
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  long:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          token: ${{ secrets.GH_TOKEN }}

      - name: Idempotency check
        id: guard
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT; exit 0
          fi
          COUNT=$(git log --since="$(date -u +%Y-%m-%dT00:00:00Z)" --format="%s" -- "channels/counters/hustle_long.txt" | grep -c "counter" || echo 0)
          [ "$COUNT" -ge 1 ] && echo "skip=true" >> $GITHUB_OUTPUT || echo "skip=false" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y --fix-missing ffmpeg fonts-liberation fonts-dejavu-core
          pip install -r channels/requirements.txt

      - name: Generate and upload Long-form
        if: steps.guard.outputs.skip != 'true'
        working-directory: channels
        env:
          GROQ_API_KEY:                  ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY:             ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_HUSTLE_TOKEN_JSON:     ${{ secrets.YOUTUBE_HUSTLE_TOKEN_JSON }}
          GH_TOKEN:                      ${{ secrets.GH_TOKEN }}
          ELEVENLABS_API_KEY:            ${{ secrets.ELEVENLABS_API_KEY }}
          D_ID_API_KEY:                  ${{ secrets.D_ID_API_KEY }}
          PEXELS_API_KEY:                ${{ secrets.PEXELS_API_KEY }}
        run: python runner.py --channel hustle --mode long

      - name: Persist counter
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channels/counters/
          git diff --staged --quiet || git commit -m "chore: hustle long counter [skip ci]"
          git pull --rebase origin main && git push
