name: Mahayukti AI — Long-form (Mon/Wed/Fri)

on:
  # Triggered exclusively by guardian.yml
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run even if already done today'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: ai-long-daily
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  long:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50
          token: ${{ secrets.GH_TOKEN }}

      - name: Idempotency check
        id: guard
        run: |
          FORCE="${{ github.event.inputs.force }}"
          if [ "$FORCE" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          TODAY_IST=$(TZ="Asia/Kolkata" date +%Y-%m-%d)
          STAMP="MahayuktiAI/ai_long_stamp.txt"
          if [ -f "$STAMP" ]; then
            LAST=$(cat "$STAMP" | tr -d '[:space:]')
            if [ "$LAST" = "$TODAY_IST" ]; then
              echo "⏭️  AI Long-form already done today ($TODAY_IST). Skipping."
              echo "skip=true" >> $GITHUB_OUTPUT; exit 0
            fi
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        if: steps.guard.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y --fix-missing ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Python dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r MahayuktiAI/requirements.txt

      - name: Generate and upload Long-form
        if: steps.guard.outputs.skip != 'true'
        working-directory: MahayuktiAI
        env:
          GROQ_API_KEY:           ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_AI_TOKEN_JSON:  ${{ secrets.YOUTUBE_AI_TOKEN_JSON }}
          GH_TOKEN:               ${{ secrets.GH_TOKEN }}
          MAKE_WEBHOOK_URL:       ${{ secrets.MAKE_WEBHOOK_URL }}
        run: python main.py --mode long

      - name: Persist tool counter and stamp
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TODAY_IST=$(TZ="Asia/Kolkata" date +%Y-%m-%d)
          echo "$TODAY_IST" > MahayuktiAI/ai_long_stamp.txt
          git add MahayuktiAI/tool_counter_long.txt MahayuktiAI/ai_long_stamp.txt
          git diff --staged --quiet || git commit -m "chore: update AI long tool counter [skip ci]"
          git pull --rebase origin main
          git push


      - name: Notify Jarvis on failure
        if: failure()
        run: |
          ERROR=$(tail -5 /tmp/step_error.log 2>/dev/null || echo "Step failed — check run logs")
          curl -s -X POST https://admin.rajaansh.com/jarvis/api/gh-notify \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"ghnotify-2026\",\"workflow\":\"${{ github.workflow }}\",\"error\":\"$(echo $GITHUB_JOB failed | head -c 300)\",\"run_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true

      - name: Done
        if: steps.guard.outputs.skip != 'true'
        run: echo "✅ Mahayukti AI long-form uploaded — $(date)"
