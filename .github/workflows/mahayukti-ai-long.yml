name: Mahayukti AI — Long-form (Mon/Wed/Fri)

on:
  # Triggered exclusively by guardian.yml
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run even if already done today'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: ai-long-daily
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  long:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50
          token: ${{ secrets.GH_TOKEN }}

      - name: Idempotency check
        id: guard
        run: |
          FORCE="${{ github.event.inputs.force }}"
          if [ "$FORCE" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          TODAY_IST=$(TZ="Asia/Kolkata" date +%Y-%m-%d)
          LAST_TS=$(git log -1 --format="%ct" -- "MahayuktiAI/tool_counter_long.txt" 2>/dev/null || echo "")
          if [ -n "$LAST_TS" ]; then
            LAST_IST=$(TZ="Asia/Kolkata" date -d "@$LAST_TS" +%Y-%m-%d)
            if [ "$LAST_IST" = "$TODAY_IST" ]; then
              echo "⏭️  AI Long-form already done today ($TODAY_IST). Skipping."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        if: steps.guard.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y --fix-missing ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Python dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r MahayuktiAI/requirements.txt

      - name: Generate and upload Long-form
        if: steps.guard.outputs.skip != 'true'
        working-directory: MahayuktiAI
        env:
          GROQ_API_KEY:           ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_AI_TOKEN_JSON:  ${{ secrets.YOUTUBE_AI_TOKEN_JSON }}
          GH_TOKEN:               ${{ secrets.GH_TOKEN }}
        run: python main.py --mode long

      - name: Persist tool counter
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add MahayuktiAI/tool_counter_long.txt
          git diff --staged --quiet || git commit -m "chore: update AI long tool counter [skip ci]"
          git pull --rebase origin main
          git push

      - name: Done
        if: steps.guard.outputs.skip != 'true'
        run: echo "✅ Mahayukti AI long-form uploaded — $(date)"
