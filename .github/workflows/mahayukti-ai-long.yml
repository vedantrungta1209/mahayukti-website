name: Mahayukti AI — Long-form (Mon/Wed/Fri)

on:
  schedule:
    - cron: '30 14 * * 1'  # Monday    8:00 PM IST — tech audience prime time
    - cron: '30 14 * * 3'  # Wednesday 8:00 PM IST
    - cron: '30 14 * * 5'  # Friday    8:00 PM IST
  workflow_dispatch:

jobs:
  long:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r MahayuktiAI/requirements.txt

      - name: Generate and upload Long-form
        working-directory: MahayuktiAI
        env:
          GROQ_API_KEY:           ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_AI_TOKEN_JSON:  ${{ secrets.YOUTUBE_AI_TOKEN_JSON }}
          GH_TOKEN:               ${{ secrets.GH_TOKEN }}
        run: python main.py --mode long

      - name: Persist tool counter
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add MahayuktiAI/tool_counter_long.txt
          git diff --staged --quiet || git commit -m "chore: update AI long tool counter [skip ci]"
          git pull --rebase origin main
          git push

      - name: Done
        run: echo "✅ Mahayukti AI long-form uploaded — $(date)"
