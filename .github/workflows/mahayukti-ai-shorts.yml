name: Mahayukti AI — Shorts (2× daily)

on:
  # Triggered exclusively by guardian.yml
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run even if already done today'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: ai-shorts-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50
          token: ${{ secrets.GH_TOKEN }}

      - name: Idempotency check
        id: guard
        run: |
          FORCE="${{ github.event.inputs.force }}"
          if [ "$FORCE" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Allow 2 runs per day — use slot-based stamps (morning / evening)
          TODAY_IST=$(TZ="Asia/Kolkata" date +%Y-%m-%d)
          HOUR_IST=$(TZ="Asia/Kolkata" date +%H)
          SLOT=$( [ "$HOUR_IST" -lt 14 ] && echo "morning" || echo "evening" )
          STAMP="MahayuktiAI/ai_short_${SLOT}_stamp.txt"
          if [ -f "$STAMP" ]; then
            LAST=$(cat "$STAMP" | tr -d '[:space:]')
            if [ "$LAST" = "$TODAY_IST" ]; then
              echo "⏭️  AI Short ($SLOT slot) already done today. Skipping."
              echo "skip=true" >> $GITHUB_OUTPUT; exit 0
            fi
          fi
          echo "SLOT=$SLOT" >> $GITHUB_ENV
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        if: steps.guard.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y --fix-missing ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Python dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r MahayuktiAI/requirements.txt

      - name: Generate, upload and cross-post Short
        if: steps.guard.outputs.skip != 'true'
        working-directory: MahayuktiAI
        env:
          GROQ_API_KEY:              ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_AI_TOKEN_JSON:     ${{ secrets.YOUTUBE_AI_TOKEN_JSON }}
          GH_TOKEN:                  ${{ secrets.GH_TOKEN }}
          FB_PAGE_ACCESS_TOKEN:      ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID:                ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID:                ${{ secrets.IG_USER_ID }}
          MAKE_WEBHOOK_URL:          ${{ secrets.MAKE_WEBHOOK_URL }}
          ELEVENLABS_API_KEY:        ${{ secrets.ELEVENLABS_API_KEY }}
        run: python main.py --mode short

      - name: Persist tool counter and stamp
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TODAY_IST=$(TZ="Asia/Kolkata" date +%Y-%m-%d)
          echo "$TODAY_IST" > "MahayuktiAI/ai_short_${SLOT}_stamp.txt"
          git add MahayuktiAI/tool_counter_short.txt "MahayuktiAI/ai_short_${SLOT}_stamp.txt"
          git diff --staged --quiet || git commit -m "chore: update AI short tool counter [skip ci]"
          git pull --rebase origin main
          git push


      - name: Notify Jarvis on failure
        if: failure()
        run: |
          ERROR=$(tail -5 /tmp/step_error.log 2>/dev/null || echo "Step failed — check run logs")
          curl -s -X POST https://admin.rajaansh.com/jarvis/api/gh-notify \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"ghnotify-2026\",\"workflow\":\"${{ github.workflow }}\",\"error\":\"$(echo $GITHUB_JOB failed | head -c 300)\",\"run_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true

      - name: Done
        run: echo "✅ Mahayukti AI Short uploaded — $(date)"
