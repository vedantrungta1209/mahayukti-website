name: Mahayukti AI — Shorts (2× daily)

on:
  schedule:
    - cron: '30 4 * * *'   # 10:00 AM IST — morning scroll peak
    - cron: '0 13 * * *'   # 6:30 PM IST  — evening commute peak
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run even if already done today'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: ai-shorts-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50
          token: ${{ secrets.GH_TOKEN }}

      - name: Idempotency check
        id: guard
        run: |
          FORCE="${{ github.event.inputs.force }}"
          if [ "$FORCE" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Allow 2 runs per day — check if we've already run twice today
          TODAY_IST=$(TZ="Asia/Kolkata" date +%Y-%m-%d)
          COUNT=$(git log --since="$(TZ='Asia/Kolkata' date -d 'today 00:00' -u +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u +%Y-%m-%dT00:00:00Z)" --format="%H" -- "MahayuktiAI/tool_counter_short.txt" 2>/dev/null | wc -l || echo "0")
          if [ "$COUNT" -ge 2 ]; then
            echo "⏭️  2 AI Shorts already done today. Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        if: steps.guard.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y --fix-missing ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Python dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r MahayuktiAI/requirements.txt

      - name: Generate, upload and cross-post Short
        if: steps.guard.outputs.skip != 'true'
        working-directory: MahayuktiAI
        env:
          GROQ_API_KEY:              ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_AI_TOKEN_JSON:     ${{ secrets.YOUTUBE_AI_TOKEN_JSON }}
          GH_TOKEN:                  ${{ secrets.GH_TOKEN }}
          IG_USER_ID:                ${{ secrets.IG_USER_ID }}
          FB_PAGE_ACCESS_TOKEN:      ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID:                ${{ secrets.FB_PAGE_ID }}
        run: python main.py --mode short

      - name: Persist tool counter
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add MahayuktiAI/tool_counter_short.txt
          git diff --staged --quiet || git commit -m "chore: update AI short tool counter [skip ci]"
          git pull --rebase origin main
          git push

      - name: Done
        run: echo "✅ Mahayukti AI Short uploaded — $(date)"
