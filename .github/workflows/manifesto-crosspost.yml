name: MahaYukti Manifesto Cross-Post (LinkedIn / FB / IG)

# One-shot — run manually. Script has a guard file, safe to re-trigger.
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  crosspost:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pillow requests-oauthlib

      - name: Cross-post manifesto
        env:
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          LINKEDIN_ACCESS_TOKEN:     ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN:       ${{ secrets.LINKEDIN_AUTHOR_URN }}
          MAKE_LINKEDIN_WEBHOOK_URL: ${{ secrets.MAKE_LINKEDIN_WEBHOOK_URL }}
          IMGBB_API_KEY:             ${{ secrets.IMGBB_API_KEY }}
          FB_PAGE_ACCESS_TOKEN:      ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID:                ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID:                ${{ secrets.IG_USER_ID }}
        run: python scripts/_crosspost_manifesto.py

      - name: Commit guard file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/_manifesto_crosspost_posted.txt 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: manifesto crosspost done" && git pull --rebase origin main && git push)
