name: MahaYukti Viral Thread Engine

on:
  schedule:
    # 7:00 PM IST = 1:30 PM UTC — Mon, Wed, Fri only (was daily, cut to avoid algorithm suppression)
    - cron: '30 13 * * 1,3,5'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: x-viral-thread
  cancel-in-progress: false   # never cancel a posting run mid-thread

jobs:
  thread:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests anthropic requests-oauthlib

      - name: Run viral thread engine
        env:
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY:             ${{ secrets.X_API_KEY }}
          X_API_SECRET:          ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python scripts/x_viral_thread.py

      - name: Commit thread log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/x_viral_thread_log.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: viral thread log" && git pull --rebase origin main && git push)
