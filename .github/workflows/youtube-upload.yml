name: YouTube Auto Upload

on:
  # Triggered exclusively by guardian.yml
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run even if already done today'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: youtube-upload-daily
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50
          token: ${{ secrets.GH_TOKEN }}

      - name: Idempotency check
        id: guard
        run: |
          FORCE="${{ github.event.inputs.force }}"
          if [ "$FORCE" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT; exit 0
          fi
          TODAY_IST=$(TZ="Asia/Kolkata" date +%Y-%m-%d)
          STAMP="content-automation/upload_stamp.txt"
          if [ -f "$STAMP" ]; then
            LAST=$(cat "$STAMP" | tr -d '[:space:]')
            if [ "$LAST" = "$TODAY_IST" ]; then
              echo "⏭️  YouTube upload already done today ($TODAY_IST). Skipping."
              echo "skip=true" >> $GITHUB_OUTPUT; exit 0
            fi
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: content-automation/requirements.txt

      - name: Install system dependencies
        if: steps.guard.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y --fix-missing ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Python dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r content-automation/requirements.txt

      - name: Run automation
        if: steps.guard.outputs.skip != 'true'
        working-directory: content-automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CHANNEL_NAME: Mahayukti Finance
          CHANNEL_HANDLE: "@MahayuktiFinance"
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python main.py

      - name: Refresh YouTube token secret
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -f content-automation/youtube_token.json ]; then
            TOKEN=$(cat content-automation/youtube_token.json)
            echo "$TOKEN" | gh secret set YOUTUBE_TOKEN_JSON --repo ${{ github.repository }}
            echo "YouTube token secret refreshed."
          else
            echo "Token file not found — secret unchanged."
          fi

      - name: Persist topic counter and stamp
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TODAY_IST=$(TZ="Asia/Kolkata" date +%Y-%m-%d)
          echo "$TODAY_IST" > content-automation/upload_stamp.txt
          git add content-automation/topic_counter.txt content-automation/upload_stamp.txt
          git diff --staged --quiet || git commit -m "chore: update topic counter [skip ci]"
          git pull --rebase origin main
          git push
