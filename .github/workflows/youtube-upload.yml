name: YouTube Auto Upload

on:
  schedule:
    - cron: '30 0 * * *'   # 6:00 AM IST
    - cron: '30 12 * * *'  # 6:00 PM IST
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: content-automation/requirements.txt

      - name: Install system dependencies
        run: sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r content-automation/requirements.txt

      - name: Run automation
        working-directory: content-automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CHANNEL_NAME: Mahayukti
          CHANNEL_HANDLE: "@WeAreMahayukti"
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python main.py

      - name: Refresh YouTube token secret
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -f content-automation/youtube_token.json ]; then
            TOKEN=$(cat content-automation/youtube_token.json)
            echo "$TOKEN" | gh secret set YOUTUBE_TOKEN_JSON --repo ${{ github.repository }}
            echo "YouTube token secret refreshed."
          else
            echo "Token file not found — secret unchanged."
          fi

      - name: Persist topic counter
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content-automation/topic_counter.txt
          git diff --staged --quiet || git commit -m "chore: update topic counter [skip ci]"
          git pull --rebase origin main
          git push
