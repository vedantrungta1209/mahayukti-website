<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signing you in with LinkedIn…</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#FFFFFF;color:#101E33;font-family:'Public Sans',Arial,sans-serif;min-height:100%;display:flex;align-items:center;justify-content:center}
.box{text-align:center;max-width:380px;padding:32px 20px}
.spinner{width:28px;height:28px;border:2.5px solid rgba(16,30,51,0.12);border-top-color:#C9943A;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 18px}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:16px;font-weight:600;margin-bottom:8px}
p{font-size:13px;color:rgba(16,30,51,0.6);line-height:1.5}
a{color:#13335E}
</style>
</head>
<body>
<div class="box">
  <div class="spinner" id="spinner"></div>
  <h1 id="title">Signing you in with LinkedIn…</h1>
  <p id="msg">Please wait, this only takes a moment.</p>
</div>
<script>
// This is the registered redirect URI for "Login with LinkedIn"
// (https://mahayukti.com/auth/linkedin-signin/callback/ — must match exactly what is set in the
// LinkedIn Developer app's "Authorized redirect URLs" and what app.html sent as redirect_uri
// for THIS flow — a different, separately-registered URI from the member-posting flow's
// /auth/linkedin/callback/, so the two never collide even though they share one LinkedIn app).
//
// Single flow now, used by the one "Continue with LinkedIn" button on the Login screen, for
// both returning members and brand-new ones -- see linkedin-signin's handleLogin for why this
// doesn't need to know which one it is. No Supabase session exists yet at this point, so this
// page calls the Edge Function with no Authorization header. The function holds the LinkedIn
// Client Secret (never shipped to the browser), exchanges the code for a token, reads
// /v2/userinfo, and returns a one-time Supabase magic-link token for the verified email —
// never the LinkedIn access token itself.
const SB_URL='https://npyoyylrqprawyavnfvv.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5weW95eWxycXByYXd5YXZuZnZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2NTQ4NTgsImV4cCI6MjExMDIzMDg1OH0.K56AWim0w16YuL0r7AZMmkE_gj9MGb3tlRucPoy3gx8';
const FUNCTION_URL=SB_URL.replace('.supabase.co','.functions.supabase.co')+'/linkedin-signin';
const REDIRECT_URI='https://mahayukti.com/auth/linkedin-signin/callback/';
const RETURN_TO='/app.html';

function fail(msg){
  document.getElementById('spinner').style.display='none';
  document.getElementById('title').textContent='Could not sign you in with LinkedIn';
  document.getElementById('msg').innerHTML=msg+'<br><br><a href="'+RETURN_TO+'#login">Return to MahaYukti</a>';
}

async function run(){
  const params=new URLSearchParams(window.location.search);
  const code=params.get('code');
  const state=params.get('state');
  const error=params.get('error');
  if(error){fail('LinkedIn said: '+(params.get('error_description')||error));return;}
  if(!code||!state){fail('Missing authorization code from LinkedIn.');return;}

  const expected=sessionStorage.getItem('li_signin_state');
  sessionStorage.removeItem('li_signin_state');
  if(!expected||state!==expected){fail('Security check failed (state mismatch). Please try again.');return;}

  try{
    const r=await fetch(FUNCTION_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json',apikey:SB_KEY},
      body:JSON.stringify({action:'login',code,redirect_uri:REDIRECT_URI})
    });
    const d=await r.json();
    if(!r.ok||!d.token_hash){fail((d.error||'Could not sign you in with LinkedIn')+(d.detail?'<br><span style="font-size:11px;opacity:.6">'+JSON.stringify(d.detail).slice(0,200)+'</span>':''));return;}
    // Single-use, short-lived -- stashed only for the one redirect back to app.html, which
    // immediately consumes it via supabase.auth.verifyOtp().
    sessionStorage.setItem('li_login_bridge',JSON.stringify({email:d.email,token_hash:d.token_hash}));
    window.location.href=RETURN_TO+'?li_login=1#login';
  }catch(e){
    fail('Network error reaching MahaYukti: '+(e.message||e));
  }
}
run();
</script>
</body>
</html>
