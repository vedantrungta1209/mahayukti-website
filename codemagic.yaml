workflows:
  mahayukti-android-debug:
    name: MahaYukti Android (debug, unsigned)
    max_build_duration: 30
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Capacitor sync
        script: npx cap sync android
      - name: Build debug APK
        script: |
          cd android
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

  mahayukti-android-release:
    name: MahaYukti Android (signed release AAB)
    max_build_duration: 30
    environment:
      groups:
        - android_signing
      node: 22
      java: 21
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Capacitor sync
        script: npx cap sync android
      - name: Write google-services.json from secure var
        script: |
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
      - name: Write upload keystore from secure var
        script: |
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > /tmp/mahayukti-upload-keystore.jks
        # CM_KEYSTORE_PATH/PASSWORD/ALIAS are read by android/app/build.gradle's
        # release signingConfig.
      - name: Build signed release AAB
        script: |
          cd android
          export CM_KEYSTORE_PATH=/tmp/mahayukti-upload-keystore.jks
          export CM_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          export CM_KEY_ALIAS="$ANDROID_KEY_ALIAS"
          ./gradlew bundleRelease --no-daemon
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab

  mahayukti-ios-debug:
    name: MahaYukti iOS (debug build, unsigned, no distribution)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      # Pinned, not "latest" -- Apple requires apps built with the current
      # SDK (flagged 2026-11-20: a build landed on the iOS 26.5 SDK when
      # Apple already required 27). "latest" can lag behind Codemagic's own
      # newest image; same class of issue already hit once this session
      # with `node: latest` silently resolving to an alpha release on Vee's
      # pipeline. Bump this explicitly when Apple's requirement moves again.
      xcode: 27.2
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Build for generic iOS device (no signing -- proves it compiles, not for distribution)
        script: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" DEVELOPMENT_TEAM="" CODE_SIGN_ENTITLEMENTS="" \
            build

  mahayukti-ios-release:
    name: MahaYukti iOS (signed, TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mahayukti.app
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      groups:
        - app_store_credentials
      node: 22
      xcode: 27.2 # pinned -- see note on the debug workflow's xcode field
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Set aps-environment to production for App Store distribution
        script: |
          PLIST=ios/App/App/App.entitlements
          /usr/libexec/PlistBuddy -c "Set :aps-environment production" "$PLIST"
      - name: Set build number from Codemagic
        script: |
          agvtool new-version -all $BUILD_NUMBER
          agvtool new-marketing-version "1.0.$BUILD_NUMBER"
        working_directory: ios/App
      - name: Build and export IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release
      - name: Upload to TestFlight
        script: |
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > /tmp/asc_key.p8
          chmod 600 /tmp/asc_key.p8
          app-store-connect publish \
            --path "$(find build/ios/ipa -name '*.ipa' | head -1)" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key @file:/tmp/asc_key.p8 \
            --testflight
    artifacts:
      - build/ios/ipa/*.ipa
