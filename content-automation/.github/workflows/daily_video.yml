name: Daily Video Generation & Upload

on:
  schedule:
    # 2:30 AM UTC = 8:00 AM IST — uploads before Indian morning audience wakes up
    - cron: "30 2 * * *"
  workflow_dispatch:  # allow manual trigger from GitHub Actions tab

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "content-automation/requirements.txt"

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r content-automation/requirements.txt

      - name: Generate and upload video
        working-directory: content-automation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          CHANNEL_NAME: Mahayukti Finance
          CHANNEL_HANDLE: "@mahayuktifinance"
        run: python main.py
